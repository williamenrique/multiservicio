<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Mantenimiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #f093fb;
            --bg-gradient-end: #f5576c;
            --primary-text-color: #1a202c;
            --secondary-text-color: #718096;
            --icon-color: #f5576c;
            --icon-color-alt: #f093fb;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --accent-color: #f5576c;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--primary-text-color);
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #ffd86f;
            top: -100px;
            right: -100px;
            animation: float-blob 22s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #ff9a9e;
            bottom: -80px;
            left: -80px;
            animation: float-blob 28s ease-in-out infinite reverse;
        }

        @keyframes float-blob {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }

        .maintenance-container {
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 580px;
            width: 100%;
            transform: translateY(-20px);
            animation: float-in 0.8s ease-out forwards;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .maintenance-icon {
            color: var(--icon-color);
            margin-bottom: 25px;
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
            background: linear-gradient(135deg, var(--icon-color), var(--icon-color-alt));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--icon-color), var(--icon-color-alt));
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            background: linear-gradient(135deg, var(--primary-text-color), var(--icon-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        p {
            font-size: 1.05rem;
            color: var(--secondary-text-color);
            font-weight: 300;
            line-height: 1.7;
        }

        .progress-bar {
            margin-top: 32px;
            height: 6px;
            background: var(--border-color);
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, var(--icon-color), var(--icon-color-alt));
            border-radius: 50px;
            animation: progress 2.5s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                left: -40%;
            }

            50% {
                left: 60%;
            }

            100% {
                left: 100%;
            }
        }

        .status-text {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--secondary-text-color);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes float-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.85;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.75rem;
            }

            p {
                font-size: 0.95rem;
            }

            .maintenance-container {
                padding: 35px 25px;
            }

            .badge {
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                </path>
            </svg>
        </div>
        <span class="badge">Trabajando en ello</span>
        <h1>Estamos en Mantenimiento</h1>
        <p>Nuestro sitio web está siendo actualizado para mejorar tu experiencia. Volveremos a estar en línea pronto.
            Disculpa las molestias.</p>
        <div class="progress-bar"></div>
        <p class="status-text">Actualizando sistema...</p>
    </div>
</body>

</html>
